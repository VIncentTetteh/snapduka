# SnapDuka analytics warehouse (ADR-0011).
#
# Vendor-neutral on purpose: the warehouse vendor is not chosen, so every model
# is plain SQL plus dbt's own cross-database macros (dbt.date_trunc,
# dbt.dateadd) — nothing Postgres-only (no `::` casts, no FILTER clauses) and
# nothing vendor-only. It runs today against the local Supabase Postgres, whose
# `warehouse` schema (migration 202609250242) is the PII-redacted,
# pseudonymised source. See profiles.yml.example.
#
# Without dbt installed, scripts/check_models.py renders the same models and
# runs them against the local database inside a rolled-back transaction.
name: snapduka_warehouse
version: "0.1.0"
config-version: 2
profile: snapduka_warehouse

model-paths: ["models"]
macro-paths: ["macros"]
test-paths: ["tests"]
target-path: "target"
clean-targets: ["target", "dbt_packages"]

models:
  snapduka_warehouse:
    staging:
      +materialized: view
      +schema: staging
    marts:
      +materialized: table
      +schema: marts
