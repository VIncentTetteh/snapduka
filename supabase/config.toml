project_id = "snapduka-foundation"

[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 17

[db.migrations]
enabled = true
schema_paths = []

[db.seed]
enabled = true
sql_paths = ["./seed.sql"]

[realtime]
enabled = true

[studio]
enabled = true
port = 54323
api_url = "http://127.0.0.1"

[inbucket]
enabled = true
port = 54324

[storage]
enabled = true
file_size_limit = "50MiB"

[auth]
enabled = true
site_url = "http://127.0.0.1:3000"
# Post-auth redirect allow-list. Dev servers hop ports (3000 → 3001) and the
# app may be opened via localhost, 127.0.0.1 or the LAN IP — all must be
# listed or GoTrue silently falls back to site_url after OAuth.
additional_redirect_urls = [
  "http://127.0.0.1:3000/**",
  "http://127.0.0.1:3001/**",
  "http://localhost:3000/**",
  "http://localhost:3001/**",
  "http://192.168.100.43:3001/**",
  # The mobile app's OAuth return target (apps/mobile lib/auth.ts builds
  # snapduka://auth/callback). Without it social sign-in starts, the provider
  # authenticates, and GoTrue then redirects to site_url — a web URL the app
  # never receives — so the browser sheet closes on the marketing site and the
  # seller is never signed in.
  "snapduka://**",
]
jwt_expiry = 3600
enable_signup = true

[auth.email]
enable_signup = true
enable_confirmations = false

[auth.email.template.magic_link]
subject = "Your SnapDuka sign-in code"
content_path = "./supabase/templates/magic_link.html"

# Local SMTP is OFF, and should stay off.
#
# This block only ever affected `supabase start` — Supabase Cloud does not read
# this file, so production SMTP lives in the dashboard (Authentication → Emails
# → SMTP Settings) and is unaffected by anything here.
#
# It was enabled with `port = "env(SMTP_PORT)"`, which the CLI parses as a
# uint16. With SMTP_PORT unset, `supabase start` dies with:
#
#   failed to parse config: 'auth.email.smtp.port' cannot parse value as
#   'uint16': strconv.ParseUint: invalid syntax
#
# That broke the Database workflow on every push from 2026-07-19 onward, so the
# entire pgTAP suite silently stopped running for two weeks — including every
# test written in that window, which had therefore never run at all.
#
# Disabled rather than papered over with dummy CI values, because local does not
# want real SMTP anyway: `supabase start` runs Mailpit on
# http://127.0.0.1:54324, which catches every outbound email instantly with no
# rate limit and no real mail sent. That is strictly better for development than
# routing OTPs through Gmail.
#
# To test a real provider locally, set enabled = true and export SMTP_HOST,
# SMTP_PORT, SMTP_USERNAME, SMTP_PASSWORD, SMTP_FROM_EMAIL, SMTP_FROM_NAME —
# but do not commit that, or CI goes dark again.
[auth.email.smtp]
enabled = false

[auth.sms]
enable_signup = true
enable_confirmations = false
max_frequency = "10s"

# Twilio SMS provider. Credentials come from the environment running
# `supabase start` — export TWILIO_ACCOUNT_SID / TWILIO_AUTH_TOKEN /
# TWILIO_MESSAGE_SERVICE_SID (or keep them in a shell profile). This only
# covers local development — the equivalent Phone provider must also be
# configured in the Supabase Cloud dashboard (Authentication → Providers →
# Phone) for the production project, since Cloud does not read this file.
[auth.sms.twilio]
enabled = true
account_sid = "env(TWILIO_ACCOUNT_SID)"
auth_token = "env(TWILIO_AUTH_TOKEN)"
message_service_sid = "env(TWILIO_MESSAGE_SERVICE_SID)"

# Google sign-in. Credentials come from the environment running `supabase
# start` — export GOOGLE_CLIENT_ID / GOOGLE_CLIENT_SECRET (or keep them in a
# shell profile). The Google OAuth client's authorized redirect URI must be:
#   http://127.0.0.1:54321/auth/v1/callback
[auth.external.google]
enabled = true
client_id = "env(GOOGLE_CLIENT_ID)"
secret = "env(GOOGLE_CLIENT_SECRET)"
skip_nonce_check = true
