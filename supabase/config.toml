project_id = "snapduka-foundation"

[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 17

[db.migrations]
enabled = true
schema_paths = []

[db.seed]
enabled = true
sql_paths = ["./seed.sql"]

[realtime]
enabled = true

[studio]
enabled = true
port = 54323
api_url = "http://127.0.0.1"

[inbucket]
enabled = true
port = 54324

[storage]
enabled = true
file_size_limit = "50MiB"

[auth]
enabled = true
site_url = "http://127.0.0.1:3000"
# Post-auth redirect allow-list. Dev servers hop ports (3000 → 3001) and the
# app may be opened via localhost, 127.0.0.1 or the LAN IP — all must be
# listed or GoTrue silently falls back to site_url after OAuth.
additional_redirect_urls = [
  "http://127.0.0.1:3000/**",
  "http://127.0.0.1:3001/**",
  "http://localhost:3000/**",
  "http://localhost:3001/**",
  "http://192.168.100.43:3001/**",
]
jwt_expiry = 3600
enable_signup = true

[auth.email]
enable_signup = true
enable_confirmations = false

[auth.email.template.magic_link]
subject = "Your SnapDuka sign-in code"
content_path = "./supabase/templates/magic_link.html"

# Custom SMTP so OTP emails send reliably in local dev instead of hitting
# Supabase's default, heavily rate-limited email service. Credentials come
# from the environment running `supabase start` — export SMTP_HOST /
# SMTP_PORT / SMTP_USERNAME / SMTP_PASSWORD / SMTP_FROM_EMAIL /
# SMTP_FROM_NAME (or keep them in .env.local). This only covers local
# development — Supabase Cloud does not read this file, so the same values
# must also be set in the dashboard (Authentication → Emails → SMTP
# Settings) for production.
[auth.email.smtp]
enabled = true
host = "env(SMTP_HOST)"
port = "env(SMTP_PORT)"
user = "env(SMTP_USERNAME)"
pass = "env(SMTP_PASSWORD)"
admin_email = "env(SMTP_FROM_EMAIL)"
sender_name = "env(SMTP_FROM_NAME)"

[auth.sms]
enable_signup = true
enable_confirmations = false
max_frequency = "10s"

# Twilio SMS provider. Credentials come from the environment running
# `supabase start` — export TWILIO_ACCOUNT_SID / TWILIO_AUTH_TOKEN /
# TWILIO_MESSAGE_SERVICE_SID (or keep them in a shell profile). This only
# covers local development — the equivalent Phone provider must also be
# configured in the Supabase Cloud dashboard (Authentication → Providers →
# Phone) for the production project, since Cloud does not read this file.
[auth.sms.twilio]
enabled = true
account_sid = "env(TWILIO_ACCOUNT_SID)"
auth_token = "env(TWILIO_AUTH_TOKEN)"
message_service_sid = "env(TWILIO_MESSAGE_SERVICE_SID)"

# Google sign-in. Credentials come from the environment running `supabase
# start` — export GOOGLE_CLIENT_ID / GOOGLE_CLIENT_SECRET (or keep them in a
# shell profile). The Google OAuth client's authorized redirect URI must be:
#   http://127.0.0.1:54321/auth/v1/callback
[auth.external.google]
enabled = true
client_id = "env(GOOGLE_CLIENT_ID)"
secret = "env(GOOGLE_CLIENT_SECRET)"
skip_nonce_check = true
