name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Enable Corepack
        run: corepack enable

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      # @snapduka/core has its own suite (i18n, countries, billing, ...) that the
      # web app's vitest config does not include.
      - name: Test shared core package
        run: pnpm --filter @snapduka/core test

      # Key and {placeholder} parity across en/fr/pcm/tw, and a count of machine
      # drafts (needsReview) still awaiting a fluent reviewer. Loads the .ts
      # catalogues via Node 22's built-in type stripping (22.18+).
      - name: i18n catalogues
        run: pnpm i18n:check

      # globals.css @theme is generated from packages/core/src/theme; fail if
      # someone edited one side only.
      - name: Design tokens in sync
        run: pnpm tokens:check

      - name: Product traceability
        run: pnpm traceability

      - name: Build
        run: pnpm build
